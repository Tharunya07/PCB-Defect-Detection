name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create necessary directories
        run: |
          mkdir -p docs/static/css
          mkdir -p docs/static/js
          mkdir -p docs/static/img
          mkdir -p docs/static/debug
          mkdir -p docs/static/uploads

      - name: Create static site content
        run: |
          # Copy static assets
          cp -r static/css/* docs/static/css/
          cp -r static/js/* docs/static/js/
          cp -r static/img/* docs/static/img/
          
          # Create sample PCB images if needed
          if [ -f "download_dataset.py" ]; then
            python download_dataset.py --train 2 --test 2 --dir docs/data
          fi
          
          # Create index.html
          cat > docs/index.html << EOL
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PCB Defect Detection Demo</title>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              <link rel="stylesheet" href="static/css/styles.css">
          </head>
          <body>
              <div class="container">
                  <header class="text-center my-5">
                      <h1 class="display-4">PCB Defect Detection Demo</h1>
                      <p class="lead">Educational Demo for Manufacturing Quality Control</p>
                  </header>
                  
                  <div class="row justify-content-center">
                      <div class="col-md-8">
                          <div class="card">
                              <div class="card-header bg-primary text-white">
                                  <h3 class="card-title mb-0">GitHub Pages Demo</h3>
                              </div>
                              <div class="card-body">
                                  <p>This is a static demo of the PCB Defect Detection project. The interactive features like image upload and analysis require a backend server and cannot run on GitHub Pages.</p>
                                  
                                  <h4>Example Defect Types:</h4>
                                  <div class="row">
                                      <div class="col-md-4 mb-3">
                                          <div class="card h-100">
                                              <img src="static/img/sample_missing_hole.jpg" class="card-img-top" alt="Missing Hole">
                                              <div class="card-body">
                                                  <h5 class="card-title">Missing Hole</h5>
                                                  <p class="card-text">A required hole is not drilled or is blocked</p>
                                              </div>
                                          </div>
                                      </div>
                                      <div class="col-md-4 mb-3">
                                          <div class="card h-100">
                                              <img src="static/img/sample_open_circuit.jpg" class="card-img-top" alt="Open Circuit">
                                              <div class="card-body">
                                                  <h5 class="card-title">Open Circuit</h5>
                                                  <p class="card-text">A break in a trace that should be continuous</p>
                                              </div>
                                          </div>
                                      </div>
                                      <div class="col-md-4 mb-3">
                                          <div class="card h-100">
                                              <img src="static/img/sample_short.jpg" class="card-img-top" alt="Short">
                                              <div class="card-body">
                                                  <h5 class="card-title">Short</h5>
                                                  <p class="card-text">Unintended connection between traces</p>
                                              </div>
                                          </div>
                                      </div>
                                  </div>
                                  
                                  <div class="alert alert-info mt-4">
                                      <h4 class="alert-heading">How It Works</h4>
                                      <p>The full application uses computer vision techniques to analyze PCB images and detect common manufacturing defects.</p>
                                      <p>To run the full interactive demo, please clone the repository and run it locally.</p>
                                  </div>
                              </div>
                              <div class="card-footer">
                                  <div class="d-grid">
                                      <a href="https://github.com/${GITHUB_REPOSITORY}" class="btn btn-primary">View on GitHub</a>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <footer class="text-center mt-5 mb-3">
                      <p class="text-muted">&copy; 2025 PCB Defect Detection Demo | Educational Project</p>
                  </footer>
              </div>
              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
          </body>
          </html>
          EOL
          
          # Copy README to docs
          cp README.md docs/
          
          # Create a debug visualization demo page
          cat > docs/debug.html << EOL
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PCB Feature Detection</title>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              <link rel="stylesheet" href="static/css/styles.css">
          </head>
          <body>
              <div class="container">
                  <header class="text-center my-5">
                      <h1 class="display-4">PCB Feature Detection</h1>
                      <p class="lead">Visualization of image processing techniques</p>
                  </header>
                  
                  <div class="row justify-content-center">
                      <div class="col-md-10">
                          <div class="card">
                              <div class="card-header bg-primary text-white">
                                  <h3 class="card-title mb-0">Example Analysis</h3>
                              </div>
                              <div class="card-body">
                                  <div class="row">
                                      <div class="col-md-6">
                                          <h5 class="text-center">Original Image</h5>
                                          <img src="static/img/sample_missing_hole.jpg" class="img-fluid rounded" alt="Original PCB">
                                      </div>
                                      <div class="col-md-6">
                                          <h5 class="text-center">Feature Detection</h5>
                                          <img src="static/img/feature_detection_example.jpg" class="img-fluid rounded" alt="Feature Detection">
                                      </div>
                                  </div>
                                  
                                  <div class="mt-4">
                                      <h5>Feature Legend:</h5>
                                      <ul class="list-unstyled">
                                          <li><span class="badge bg-primary">Blue</span> - Detected Contours</li>
                                          <li><span class="badge bg-success">Green</span> - Potential Holes</li>
                                          <li><span class="badge bg-danger">Red</span> - PCB Traces</li>
                                      </ul>
                                  </div>
                              </div>
                              <div class="card-footer">
                                  <a href="index.html" class="btn btn-primary">Back to Home</a>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <footer class="text-center mt-5 mb-3">
                      <p class="text-muted">&copy; 2025 PCB Defect Detection Demo | Educational Project</p>
                  </footer>
              </div>
              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
          </body>
          </html>
          EOL
          
          # If we have a feature detection example, copy it
          if [ -f "static/debug/sample_debug.jpg" ]; then
            cp static/debug/sample_debug.jpg docs/static/img/feature_detection_example.jpg
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch the action should deploy to
          folder: docs      # The folder the action should deploy
          clean: true       # Automatically remove deleted files from the deploy branch
